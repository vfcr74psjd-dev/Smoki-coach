name: Build Sm0ki Solo Coach

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'VERSION'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate version
        shell: pwsh
        run: |
          $versionText = (Get-Content VERSION -Raw).Trim()
          try {
            $parsed = [Version]::Parse($versionText)
          } catch {
            throw "VERSION mora biti veljavna verzija, npr. 1.1.0. Trenutno: '$versionText'"
          }
          if ($parsed.Build -lt 0) {
            throw "VERSION mora vsebovati major.minor.patch, npr. 1.1.0."
          }

      - name: Publish EXE
        shell: pwsh
        run: |
          $versionText = (Get-Content VERSION -Raw).Trim()
          dotnet publish src/Sm0kiSoloCoach.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$versionText
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Get-ChildItem src -Recurse -Filter Sm0kiSoloCoach.exe |
            Where-Object { $_.FullName -match 'publish' } |
            Select-Object -First 1

          if ($null -eq $exe) { throw "Published EXE ni bil najden." }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist\Sm0kiSoloCoach.exe -Force

      - name: Publish GitHub release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionText = (Get-Content VERSION -Raw).Trim()
          $tag = "v$versionText"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\Sm0kiSoloCoach.exe --clobber
          } else {
            gh release create $tag dist\Sm0kiSoloCoach.exe --target "$env:GITHUB_SHA" --title "Sm0ki Solo Coach $versionText" --notes "Samodejna posodobitev Sm0ki Solo Coach."
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate update manifest
        shell: pwsh
        run: |
          $versionText = (Get-Content VERSION -Raw).Trim()
          $sha = (Get-FileHash dist\Sm0kiSoloCoach.exe -Algorithm SHA256).Hash

          $manifest = @{
            version = $versionText
            url = "https://github.com/vfcr74psjd-dev/Smoki-coach/releases/download/v$versionText/Sm0kiSoloCoach.exe"
            sha256 = $sha
            notes = "Sm0ki Solo Coach $versionText"
          } | ConvertTo-Json

          Set-Content update.json $manifest -Encoding UTF8

      - name: Commit update manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update.json
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update manifest [skip ci]"
            git push
          }
