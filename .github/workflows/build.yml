name: Build Sm0ki Solo Coach

on:
  push:
    branches: [ main ]
    paths:
      - 'source.zip'
      - 'VERSION'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate source archive
        shell: pwsh
        run: |
          if (!(Test-Path source.zip)) { throw "source.zip manjka" }
          Get-Item source.zip | Format-List Name,Length

      - name: Extract source
        shell: pwsh
        run: |
          if (Test-Path buildsrc) { Remove-Item buildsrc -Recurse -Force }
          New-Item -ItemType Directory -Force buildsrc | Out-Null
          tar -xf source.zip -C buildsrc
          $proj = Get-ChildItem buildsrc -Recurse -Filter Sm0kiSoloCoach.csproj | Select-Object -First 1
          if ($null -eq $proj) { throw "Sm0kiSoloCoach.csproj ni bil najden po razpakiranju." }

      - name: Publish EXE
        shell: pwsh
        run: |
          $proj = Get-ChildItem buildsrc -Recurse -Filter Sm0kiSoloCoach.csproj | Select-Object -First 1
          dotnet publish $proj.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem $proj.Directory.FullName -Recurse -Filter Sm0kiSoloCoach.exe | Where-Object { $_.FullName -match 'publish' } | Select-Object -First 1
          if ($null -eq $exe) { throw "Published EXE ni bil najden." }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist\Sm0kiSoloCoach.exe -Force

      - name: Generate update manifest
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $sha = (Get-FileHash dist\Sm0kiSoloCoach.exe -Algorithm SHA256).Hash
          $manifest = @{
            version = $version
            url = 'https://raw.githubusercontent.com/vfcr74psjd-dev/Smoki-coach/main/dist/Sm0kiSoloCoach.exe'
            sha256 = $sha
            notes = 'Samodejna posodobitev Sm0ki Solo Coach.'
          } | ConvertTo-Json
          Set-Content update.json $manifest -Encoding UTF8

      - name: Commit built update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Sm0kiSoloCoach.exe update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Build update [skip ci]"
            git push
          }
