name: Validate Sm0ki Solo Coach

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'VERSION'
      - 'installer/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'VERSION'
      - 'installer/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore app
        run: dotnet restore src/Sm0kiSoloCoach.csproj

      - name: Restore product smoke tests
        run: dotnet restore tests/Sm0kiSoloCoach.Smoke/Sm0kiSoloCoach.Smoke.csproj

      - name: Build
        run: dotnet build src/Sm0kiSoloCoach.csproj -c Release --no-restore

      - name: Build product smoke tests
        run: dotnet build tests/Sm0kiSoloCoach.Smoke/Sm0kiSoloCoach.Smoke.csproj -c Release --no-restore

      - name: Validate candidate version
        shell: pwsh
        run: |
          $versionText = (Get-Content VERSION -Raw).Trim()
          try {
            $parsed = [Version]::Parse($versionText)
          } catch {
            throw "VERSION is invalid: '$versionText'"
          }
          if ($parsed.Build -lt 0) {
            throw "VERSION must use major.minor.patch."
          }
          "SMOKI_VERSION=$versionText" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download pinned CS2 demo fixture
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/saul/demofile-net/fd59701a998cf30a46adc4942e063d90de73c07a/demos/14160.dem"
          $path = Join-Path $env:RUNNER_TEMP "smoki-product-smoke.dem"
          Invoke-WebRequest -Uri $url -OutFile $path
          if (-not (Test-Path $path)) { throw "CS2 demo fixture was not downloaded." }
          if ((Get-Item $path).Length -lt 100000) { throw "CS2 demo fixture is unexpectedly small." }

      - name: Run product Ground Truth + phone smoke tests
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "smoki-product-smoke.dem"
          dotnet run --project tests/Sm0kiSoloCoach.Smoke/Sm0kiSoloCoach.Smoke.csproj -c Release --no-build -- $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained release candidate
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoki-product-publish"
          dotnet publish src/Sm0kiSoloCoach.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:SMOKI_VERSION -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Join-Path $out "Sm0kiSoloCoach.exe"
          if (-not (Test-Path $exe)) { throw "Self-contained EXE was not created." }
          if ((Get-Item $exe).Length -lt 20000000) { throw "Self-contained EXE is unexpectedly small." }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist\Sm0kiSoloCoach.exe -Force

      - name: Build installer candidate
        shell: pwsh
        run: |
          $issText = Get-Content installer\Sm0kiSoloCoach.iss -Raw
          $issText = $issText -replace '#define MyAppVersion "[^"]+"', ('#define MyAppVersion "' + $env:SMOKI_VERSION + '"')
          Set-Content installer\Sm0kiSoloCoach.iss $issText -Encoding UTF8

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          & $iscc installer\Sm0kiSoloCoach.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = "dist\Sm0kiSoloCoach-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer candidate was not created." }
          if ((Get-Item $setup).Length -lt 10000000) { throw "Installer candidate is unexpectedly small." }
