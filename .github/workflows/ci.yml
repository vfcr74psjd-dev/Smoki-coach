name: Validate Sm0ki Solo Coach

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'VERSION'
      - 'installer/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/Sm0kiSoloCoach.csproj
      - name: Build
        run: dotnet build src/Sm0kiSoloCoach.csproj -c Release --no-restore
